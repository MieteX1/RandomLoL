<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Losowy Champ</title>
<style>
  :root { --bg:#0b1118; --panel:#131c27; --line:#243244; --gold:#c8aa6e; --text:#e6e9ee; --muted:#8a97a8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; color:var(--gold); letter-spacing:.5px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.9rem; }
  .roles { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
  .roles button { padding:12px 4px; background:var(--panel); border:1px solid var(--line); color:var(--text);
    border-radius:8px; cursor:pointer; font-weight:600; }
  .roles button:hover { border-color:var(--gold); }
  .roles button.active { background:var(--gold); color:#111; border-color:var(--gold); }
  .roles small { display:block; font-weight:400; opacity:.7; font-size:.7rem; }
  /* opcje w siatce 3-kolumnowej (opis | kontrolka | wartość), dzięki czemu wszystko jest w równych rzędach */
  .opts { display:grid; grid-template-columns:auto minmax(90px,240px) auto; justify-content:start; align-items:center; gap:10px 14px; margin-bottom:16px; color:var(--muted); font-size:.9rem; }
  .opts .val { white-space:nowrap; }
  .opts .cnt { color:var(--muted); font-size:.8rem; margin-left:6px; }
  .opts select { grid-column:2 / span 2; justify-self:start; max-width:100%; }
  .actions { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .actions button { flex:1; min-width:140px; padding:14px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); font-size:1rem; cursor:pointer; }
  .actions button.primary { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; }
  .actions button:disabled { opacity:.4; cursor:not-allowed; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
  .champ { display:flex; gap:16px; align-items:center; }
  .champ img { width:88px; height:88px; border-radius:12px; border:2px solid var(--gold); }
  .champ h2 { margin:0; font-size:1.8rem; }
  .meta { color:var(--muted); font-size:.85rem; }
  .meta a { color:var(--gold); }
  .itemrow { display:flex; gap:16px; align-items:flex-start; margin-top:20px; }
  .items { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:10px; }
  .bootbox { width:92px; flex:none; border-left:1px solid var(--line); padding-left:16px; }
  /* napis "Buty" ma stałą wysokość, a lista itemów dostaje identyczny odstęp u góry,
     dzięki czemu ikony butów leżą dokładnie na wysokości ikon pozostałych itemów */
  .bootbox .lbl { height:16px; line-height:16px; text-align:center; font-size:.7rem; color:var(--gold); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
  .items { padding-top:22px; }
  .startbox { display:flex; align-items:center; gap:14px; margin-top:20px; padding:12px 14px; background:rgba(200,170,110,.06); border:1px solid var(--line); border-radius:10px; }
  .startbox .lbl { font-size:.7rem; color:var(--gold); text-transform:uppercase; letter-spacing:1px; width:64px; flex:none; }
  .sitems { display:flex; gap:10px; flex:none; }
  .sitem { position:relative; width:44px; }
  .sitem img { width:44px; height:44px; border-radius:8px; border:1px solid var(--line); display:block; }
  .sitem .n { position:absolute; right:-4px; bottom:-4px; background:var(--gold); color:#111; font-size:.7rem; font-weight:700; border-radius:9px; padding:0 5px; line-height:16px; }
  .sinfo { font-size:.85rem; color:var(--muted); min-width:0; }
  .sinfo b { color:var(--text); font-weight:600; }
  .item { text-align:center; font-size:.7rem; color:var(--muted); }
  .item img { width:100%; max-width:72px; border-radius:8px; border:1px solid var(--line); display:block; margin:0 auto 4px; }
  .item.boots img { border-color:var(--gold); }
  .opts input[type=range] { width:100%; margin:0; accent-color:var(--gold); }
  .opts select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; font-size:.9rem; }
  .opts b { color:var(--text); display:inline-block; min-width:3.2em; }
  .note { color:var(--muted); font-size:.85rem; margin:-4px 0 16px; }
  .swapbox { display:flex; align-items:center; gap:14px; margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); color:var(--muted); font-size:.85rem; }
  .swapbox .item { width:92px; flex:none; }
  .swapbox b { color:var(--text); font-weight:600; }
  .item .cost { color:var(--gold); }
  .item .st { color:var(--muted); }
  .wr-good { color:#5fcf80; font-weight:600; }
  .wr-bad { color:#e5635f; font-weight:600; }
  .pr { color:#e6c34a; font-weight:600; }
  .facts { margin-top:20px; border-top:1px solid var(--line); padding-top:14px; }
  .facts h3 { margin:0 0 8px; font-size:.95rem; color:var(--gold); }
  .facts ul { margin:0; padding-left:18px; color:var(--muted); font-size:.9rem; }
  .facts li { margin-bottom:4px; }
  .facts b { color:var(--text); font-weight:600; }
  .tabs { display:flex; gap:4px; margin:0 0 18px; border-bottom:1px solid var(--line); }
  .tabs button { background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; padding:10px 14px; color:var(--muted); font:inherit; font-weight:600; cursor:pointer; }
  .tabs button:hover { color:var(--text); }
  .tabs button.active { color:var(--gold); border-bottom-color:var(--gold); }
  section[hidden] { display:none; }
  .rule { display:flex; gap:16px; align-items:center; margin-top:20px; padding:16px; border:1px solid #7a2a2a; background:rgba(229,99,95,.07); border-radius:10px; }
  .rule.good { border-color:#2f6b45; background:rgba(95,207,128,.07); }
  .rule.info { border-color:var(--line); background:rgba(200,170,110,.06); }
  .rule .rimg img { width:64px; height:64px; border-radius:10px; border:2px solid var(--gold); display:block; }
  .rule .rimg { flex:none; position:relative; }
  .rule .rtag { font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--gold); }
  .rule h3 { margin:2px 0 4px; font-size:1.25rem; }
  .rule h3 small { color:var(--muted); font-weight:400; font-size:.8rem; }
  .rule p { margin:0; color:var(--muted); font-size:.88rem; }
  .rule p b { color:var(--text); }
  .rlist { margin-top:18px; }
  .rlist h4 { margin:0 0 8px; font-size:.85rem; color:var(--gold); font-weight:600; }
  .rlist h4 span { color:var(--muted); font-weight:400; }
  .mini { display:flex; flex-wrap:wrap; gap:10px; }
  .mini .it { width:72px; text-align:center; font-size:.65rem; line-height:1.3; color:var(--muted); }
  .mini .it img { width:44px; height:44px; border-radius:8px; border:1px solid var(--line); display:block; margin:0 auto 3px; }
  .mini .it.out img { border-color:#7a2a2a; opacity:.85; }
  .hist { margin-top:20px; color:var(--muted); font-size:.85rem; }
  .hist b { color:var(--text); font-weight:500; }
  .err { background:#3a1a1a; border:1px solid #7a2a2a; padding:16px; border-radius:8px; }
  @media (max-width:520px){
    .opts { grid-template-columns:1fr auto; justify-content:stretch; gap:6px 12px; }
    .opts > span:not(.val) { grid-column:1 / -1; margin-top:6px; }
    .opts select { grid-column:1 / -1; justify-self:stretch; }
  }
  @media (max-width:520px){ .itemrow{ align-items:stretch; } .items{ padding-top:0; } .startbox{ flex-wrap:wrap; } .itemrow{ flex-direction:column; } .bootbox{ border-left:0; border-top:1px solid var(--line); padding:10px 0 0; width:100%; } .champ img{width:64px;height:64px;} .champ h2{font-size:1.4rem;} }
</style>
</head>
<body>
<main>
  <h1>Losowy Champ</h1>
  <p class="sub" id="sub"></p>

  <nav class="tabs">
    <button id="tabBtnBuild" class="active">🎲 Losowy build</button>
    <button id="tabBtnChallenge">⚔️ Wyzwania</button>
  </nav>

  <section id="tabBuild">
  <div class="roles" id="roles"></div>

  <div class="opts">
    <span title="Championi rzadsi niż ten próg (na wybranej roli) nie będą losowani. Działa przy następnym losowaniu.">Min. pick rate championa:</span>
    <input type="range" id="minChampPr" min="0" max="5" step="0.1" value="0.2" autocomplete="off">
    <span class="val"><b id="minChampPrVal">0.2%</b><span class="cnt" id="champCnt"></span></span>

    <span title="Itemy rzadsze niż ten próg nie będą losowane (przy następnym losowaniu)">Min. pick rate itemu:</span>
    <input type="range" id="minPr" min="0" max="5" step="0.1" value="0.3" autocomplete="off">
    <span class="val"><b id="minPrVal">0.3%</b></span>

    <span>Kolejność:</span>
    <select id="sortBy">
      <option value="random">Losowa</option>
      <option value="time-asc">Czas zakupu: od najwcześniejszego</option>
      <option value="time-desc">Czas zakupu: od najpóźniejszego</option>
      <option value="gold-asc">Cena: od najtańszego</option>
      <option value="gold-desc">Cena: od najdroższego</option>
      <option value="pr-desc">Pick rate: od największego</option>
      <option value="pr-asc">Pick rate: od najmniejszego</option>
      <option value="wr-desc">Winrate: od największego</option>
      <option value="wr-asc">Winrate: od najmniejszego</option>
    </select>
  </div>
  <div class="note" id="roleNote">Wybierz rolę, aby zacząć.</div>

  <div class="actions">
    <button class="primary" id="rollAll" disabled>🎲 Losuj championa + itemy</button>
    <button id="rollItems" disabled>🛒 Przelosuj same itemy</button>
  </div>

  <div id="out"></div>
  <div class="hist" id="hist"></div>
  </section>

  <section id="tabChallenge" hidden>
    <div class="roles" id="chRoles"></div>

    <div class="opts">
      <span>Typ wyzwania:</span>
      <select id="chType">
        <option value="random">Losowe</option>
        <option value="component">🚫 Zakazany składnik</option>
        <option value="first">1️⃣ Obowiązkowy pierwszy item</option>
        <option value="boots">👟 Bez butów do minuty…</option>
        <option value="meta">🔥 Zakaz metowych itemów</option>
      </select>
    </div>
    <div class="note" id="chNote">Wybierz rolę, aby wylosować championa i wyzwanie. Progi pick rate (championa i itemu) z zakładki „Losowy build” obowiązują też tutaj.</div>

    <div class="actions">
      <button class="primary" id="chRollAll" disabled>🎲 Losuj championa + wyzwanie</button>
      <button id="chRollRule" disabled>🔁 Nowe wyzwanie, ten sam champion</button>
    </div>

    <div id="chOut"></div>
  </section>
</main>

<script src="data.js"></script>
<script>
(function () {
  const D = window.LOL_DATA;
  const out = document.getElementById('out');

  if (!D) {
    out.innerHTML = '<div class="err"><b>Brak pliku data.js.</b><br>Uruchom <code>node scrape.mjs</code> w tym folderze, ' +
      'poczekaj aż skończy, i odśwież stronę.</div>';
    return;
  }

  const ROLES = [
    ['top', 'Top', 'TOP'], ['jungle', 'Jungle', 'JNG'], ['middle', 'Mid', 'MID'],
    ['bottom', 'Bot / ADC', 'BOT'], ['support', 'Support', 'SUP'],
  ];
  const IMG = 'https://ddragon.leagueoflegends.com/cdn/' + D.ddragonVersion + '/img/';

  const $ = (id) => document.getElementById(id);
  const rolesEl = $('roles'), rollAll = $('rollAll'), rollItems = $('rollItems');
  let role = null, current = null; // current = { champ, laneData, items:[ids] }
  const history = [];

  const date = D.generated ? new Date(D.generated).toLocaleDateString('pl-PL') : '?';
  $('sub').textContent = 'Dane z Lolalytics (Emerald+, Solo/Duo)' + (D.patch ? ', patch ' + D.patch : '') +
    ', zebrane ' + date + '. Min. ' + D.minGames + ' gier na rolę.';

  // pool = wszyscy championowie z danej roli (do statystyk i ciekawostek),
  // eligible = ci, którzy przechodzą próg pick rate z suwaka (z nich losujemy)
  function pool(r) {
    return Object.values(D.champions).filter((c) => c.lanes[r]);
  }
  const minChampPr = () => parseFloat($('minChampPr').value) || 0;
  function eligible(r) {
    const min = minChampPr();
    return pool(r).filter((c) => min <= 0 || (c.lanes[r].pickRate || 0) >= min);
  }

  const roleBtns = {};
  function setRoleBtn(key, label) {
    const all = pool(key).length, n = eligible(key).length;
    roleBtns[key].innerHTML = label + '<small>' + (n === all ? n : n + ' z ' + all) + ' champów</small>';
  }
  function refreshCounts() {
    ROLES.forEach(([key, label]) => setRoleBtn(key, label));
    if (role) $('champCnt').textContent = eligible(role).length + ' z ' + pool(role).length + ' championów';
  }
  // zakres suwaka dopasowany do roli: do pick rate najpopularniejszego championa na tej roli (zaokrąglone w górę)
  function updateChampSlider() {
    const maxPr = Math.max(0, ...pool(role).map((c) => c.lanes[role].pickRate || 0));
    const sl = $('minChampPr');
    sl.max = Math.max(1, Math.ceil(maxPr));
    if (parseFloat(sl.value) > parseFloat(sl.max)) sl.value = sl.max;
    $('minChampPrVal').textContent = sl.value + '%';
  }

  ROLES.forEach(([key, label]) => {
    const b = document.createElement('button');
    roleBtns[key] = b;
    b.disabled = pool(key).length === 0;
    b.onclick = () => {
      role = key;
      [...rolesEl.children].forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      rollAll.disabled = false;
      rollItems.disabled = true;
      $('roleNote').textContent = key === 'bottom'
        ? 'Bot / ADC: 6 itemów + buty (misja ADC przenosi buty do osobnego slotu).'
        : '5 itemów + buty.';
      updateChampSlider();
      refreshCounts();
      rollChampion();
    };
    rolesEl.appendChild(b);
  });
  refreshCounts();

  function randInt(n) { return Math.floor(Math.random() * n); }

  function pickChampion(r) {
    const list = eligible(r);
    if (!list.length) return null;
    return list[randInt(list.length)];
  }

  function sample(arr, k) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a.slice(0, k);
  }

  function pickItems(lane) {
    const minPr = parseFloat($('minPr').value) || 0;
    const st = lane.itemStats || {};
    // item bez statystyk (np. awaryjny tryb skryptu) nie jest odrzucany przez próg
    const okPr = (id) => !st[id] || st[id].pr >= minPr;

    // buty: najpierw z danych Lolalytics dla tego championa; jeśli ich nie ma, losujemy z puli wszystkich butów
    const fromLolalytics = lane.boots.length > 0;
    const bootPool = fromLolalytics ? lane.boots : (D.allBoots || []);
    let bootOk = bootPool.filter(okPr);
    if (!bootOk.length && bootPool.length) {
      // próg za wysoki dla każdych butów: bierzemy najpopularniejsze, bo buty są zawsze
      bootOk = [bootPool.slice().sort((a, b) => ((st[b] && st[b].pr) || 0) - ((st[a] && st[a].pr) || 0))[0]];
    }
    const boot = bootOk.length ? [bootOk[randInt(bootOk.length)]] : [];

    // bot/ADC (misja) ma 6 itemów + buty, reszta ról 5 + buty
    const nMain = role === 'bottom' ? 6 : 5;
    const itemPool = lane.items.filter(okPr);
    const rest = sample(itemPool, nMain);

    // opcjonalnie: item "za buty" w bardzo późnej fazie gry, losowany spośród najpóźniej kupowanych, których nie mamy
    // (bot/ADC nie ma tej sekcji: ma 6 slotów + osobny slot na buty)
    let swap = null;
    const taken = new Set(rest);
    const cand = itemPool.filter((id) => !taken.has(id));
    if (role !== 'bottom' && boot.length && cand.length) {
      const byTime = cand.slice().sort((a, b) => ((st[b] && st[b].time) || 0) - ((st[a] && st[a].time) || 0));
      const top = byTime.slice(0, Math.max(3, Math.ceil(byTime.length * 0.4)));
      swap = top[randInt(top.length)];
    }
    // zestaw startowy z Lolalytics (Starting Item Sets): losowo spośród popularnych zestawów tego championa
    const sets = lane.startSets;
    const start = sets && sets.length ? sets[randInt(sets.length)] : null;

    return {
      boot, rest, swap, start, noStartData: sets === undefined, nMain, minPr,
      poolSize: itemPool.length, bootPoolSize: bootOk.length,
      bootFallback: boot.length > 0 && !fromLolalytics,
    };
  }

  // sortowanie wylosowanych itemów (nie rusza butów); "random" zostawia kolejność losowania
  function sortedRest(ids, laneData) {
    const mode = $('sortBy').value;
    if (mode === 'random') return ids;
    const st = laneData.itemStats || {};
    const val = {
      time: (id) => (st[id] && st[id].time != null ? st[id].time : null),
      gold: (id) => (D.itemCost && D.itemCost[id] != null ? D.itemCost[id] : null),
      pr: (id) => (st[id] ? st[id].pr : null),
      wr: (id) => (st[id] ? st[id].wr : null),
    }[mode.split('-')[0]];
    const dir = mode.endsWith('desc') ? -1 : 1;
    return ids.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1;   // brak danych zawsze na końcu
      if (y === null) return -1;
      return (x - y) * dir;
    });
  }

  function rollChampion() {
    const champ = pickChampion(role);
    if (!champ) {
      current = null;
      rollItems.disabled = true;
      out.innerHTML = '<div class="err">Żaden champion na tej roli nie ma pick rate ≥ <b>' + minChampPr() +
        '%</b>. Obniż próg championa suwakiem i losuj ponownie.</div>';
      return;
    }
    const laneData = champ.lanes[role];
    current = { champ, laneData, items: pickItems(laneData) };
    history.unshift(champ.name);
    render();
    rollItems.disabled = false;
  }

  function rollItemsOnly() {
    if (!current) return;
    current.items = pickItems(current.laneData);
    current.facts = null; // ciekawostki o itemach muszą dotyczyć nowego zestawu
    render();
  }

  // zestaw startowy: ikony z licznikiem sztuk (np. 2 potki) + statystyki zestawu
  function startHtml(items, laneData) {
    if (items.noStartData) {
      return '<div class="startbox"><div class="sinfo">Brak danych o itemach startowych. Uruchom ponownie <code>node scrape.mjs</code>.</div></div>';
    }
    const s = items.start;
    if (!s) return '';
    const counts = {};
    s.ids.forEach((id) => { counts[id] = (counts[id] || 0) + 1; });
    const ids = Object.keys(counts);
    const names = ids.map((id) => (counts[id] > 1 ? counts[id] + '× ' : '') + esc(D.items[id] || id));
    return '<div class="startbox"><div class="lbl">🏁 Start</div>' +
      '<div class="sitems">' + ids.map((id) =>
        '<div class="sitem" title="' + esc(D.items[id] || id) + '"><img src="' + IMG + 'item/' + id + '.png" alt="" loading="lazy">' +
        (counts[id] > 1 ? '<span class="n">×' + counts[id] + '</span>' : '') + '</div>').join('') + '</div>' +
      '<div class="sinfo"><b>' + names.join(' + ') + '</b><br>' +
        '<span class="' + (s.wr >= 50 ? 'wr-good' : 'wr-bad') + '">WR ' + s.wr + '%</span> · ' +
        '<span class="pr">PR ' + s.pr + '%</span> · ' + fmt(s.games) + ' gier</div></div>';
  }

  const fmt = (n) => Math.round(n).toLocaleString('pl-PL');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  function itemHtml(id, isBoots, laneData) {
    const name = D.items[id] || id;
    const cost = D.itemCost && D.itemCost[id];
    // statystyki pojedynczego itemu (jeśli skrypt je zebrał): { wr, pr, games }
    const s = laneData.itemStats && laneData.itemStats[id];
    const tip = esc(name) + (s ? ' — ' + fmt(s.games) + ' gier' + (s.time ? ', kupowany średnio ok. ' + Math.round(s.time) + ' min' : '') : '');
    return '<div class="item' + (isBoots ? ' boots' : '') + '" title="' + tip + '">' +
      '<img src="' + IMG + 'item/' + id + '.png" alt="" loading="lazy">' + esc(name) +
      (cost ? '<div class="cost">' + fmt(cost) + ' g</div>' : '') +
      (s ? '<div class="st">' +
        '<div class="' + (s.wr >= 50 ? 'wr-good' : 'wr-bad') + '">WR ' + s.wr + '%</div>' +
        '<div class="pr">PR ' + s.pr + '%</div>' +
        (s.time != null ? '<div>⏱ ~' + Math.round(s.time) + ' min</div>' : '') + '</div>' : '') + '</div>';
  }

  // ---------- ciekawostki liczone z naszych danych ----------
  function buildFacts(champ, laneData, items) {
    const facts = [];
    const list = pool(role).sort((a, b) => b.lanes[role].games - a.lanes[role].games);
    const roleName = ROLES.find((r) => r[0] === role)[1];
    const rank = list.findIndex((c) => c.name === champ.name) + 1;
    const totalGames = list.reduce((s, c) => s + c.lanes[role].games, 0);
    const share = (laneData.games / totalGames) * 100;

    facts.push('Jest <b>#' + rank + '</b> z ' + list.length + ' najczęściej granych championów na roli ' + roleName +
      ' (' + share.toFixed(1).replace('.', ',') + '% wszystkich gier tej roli w naszej puli).');

    const withWr = list.filter((c) => c.lanes[role].winrate);
    if (laneData.winrate && withWr.length > 3) {
      const g = withWr.reduce((s, c) => s + c.lanes[role].games, 0);
      const avg = withWr.reduce((s, c) => s + c.lanes[role].winrate * c.lanes[role].games, 0) / g;
      const diff = laneData.winrate - avg;
      const wrRank = withWr.sort((a, b) => b.lanes[role].winrate - a.lanes[role].winrate)
        .findIndex((c) => c.name === champ.name) + 1;
      facts.push('Winrate <b>' + laneData.winrate + '%</b> to ' + (diff >= 0 ? '+' : '') + diff.toFixed(1).replace('.', ',') +
        ' pkt względem średniej roli (' + avg.toFixed(1).replace('.', ',') + '%). Miejsce <b>#' + wrRank + '</b> z ' + withWr.length +
        ' pod względem winrate.');
    }

    if (typeof laneData.lanePct === 'number') {
      if (laneData.lanePct < 10) facts.push('Tylko <b>' + laneData.lanePct + '%</b> gier tego championa to ' + roleName + ' — to zdecydowanie off-meta pick!');
      else if (laneData.lanePct > 90) facts.push(roleName + ' to jego domowa rola: <b>' + laneData.lanePct + '%</b> wszystkich jego gier.');
      else facts.push('Na ' + roleName + ' gra się nim w <b>' + laneData.lanePct + '%</b> jego meczów.');
    }

    if (laneData.tier) facts.push('Lolalytics daje mu na tej roli tier <b>' + esc(laneData.tier) + '</b>' +
      (laneData.rank ? ' (miejsce ' + laneData.rank + '/' + laneData.rankTotal + ' wśród championów roli)' : '') + '.');
    if (typeof laneData.banRate === 'number') facts.push('Ban rate: <b>' + String(laneData.banRate).replace('.', ',') + '%</b>' +
      (typeof laneData.pickRate === 'number' ? ', pick rate: <b>' + String(laneData.pickRate).replace('.', ',') + '%</b>' : '') + ' (Emerald+).');

    const others = Object.keys(champ.lanes).filter((r) => r !== role).map((r) => ROLES.find((x) => x[0] === r)[1]);
    if (others.length) facts.push('W naszej puli występuje też na: <b>' + others.join(', ') + '</b>.');

    if (champ.title) facts.push('Pełny tytuł: <b>' + esc(champ.name) + ', ' + esc(champ.title) + '</b>' +
      (champ.tags && champ.tags.length ? ' (klasa: ' + champ.tags.join('/') + ')' : '') + '.');
    if (champ.difficulty) facts.push('Trudność według Riotu: <b>' + champ.difficulty + '/10</b>' +
      (champ.partype ? ', zasób: ' + esc(champ.partype) : '') + '.');

    const all = items.rest.concat(items.boot);
    const costs = all.map((id) => (D.itemCost && D.itemCost[id]) || 0);
    if (costs.every((c) => c > 0) && all.length) {
      const total = costs.reduce((a, b) => a + b, 0);
      const maxI = all[costs.indexOf(Math.max.apply(null, costs))];
      facts.push('Pełny build kosztuje <b>' + fmt(total) + ' g</b>. Najdroższy element: <b>' + esc(D.items[maxI]) + '</b> (' + fmt(Math.max.apply(null, costs)) + ' g).');
    }
    const st = laneData.itemStats || {};
    const scored = all.filter((id) => st[id] && st[id].games >= 50).map((id) => ({ id, s: st[id] }));
    if (scored.length >= 2) {
      const best = scored.slice().sort((a, b) => b.s.wr - a.s.wr)[0];
      const rare = scored.slice().sort((a, b) => a.s.pr - b.s.pr)[0];
      facts.push('Najwyższy winrate w Twoim zestawie ma <b>' + esc(D.items[best.id]) + '</b> (' + best.s.wr + '%, ' + fmt(best.s.games) + ' gier).');
      facts.push('Najrzadszy item w zestawie: <b>' + esc(D.items[rare.id]) + '</b> — kupuje go tylko ' + rare.s.pr + '% graczy.');
      const timed = scored.filter((x) => x.s.time);
      if (timed.length) {
        const late = timed.slice().sort((a, b) => b.s.time - a.s.time)[0];
        facts.push('<b>' + esc(D.items[late.id]) + '</b> to u graczy typowy późny zakup: średnio około ' + Math.round(late.s.time) + ' minuty gry.');
      }
    }
    facts.push('Pula itemów na tej roli dla tego championa: <b>' + items.poolSize + '</b> gotowych + ' + items.bootPoolSize + ' butów' +
      (items.minPr > 0 ? ' (po filtrze pick rate ≥ ' + items.minPr + '%)' : '') + '. ' +
      'Szansa, że wylosujesz dokładnie taki zestaw (bez kolejności): około 1 do ' +
      fmt(comb(items.poolSize, items.rest.length) * Math.max(1, items.bootPoolSize)) + '.');
    return facts;
  }

  function comb(n, k) {
    if (k > n) return 1;
    let r = 1;
    for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i;
    return Math.round(r);
  }

  function randomFacts(facts, n) {
    return sample(facts, Math.min(n, facts.length));
  }

  function render() {
    const { champ, laneData, items } = current;
    // ciekawostki losujemy raz na losowanie, żeby zmiana sortowania ich nie przetasowywała
    if (!current.facts) current.facts = randomFacts(buildFacts(champ, laneData, items), 4);
    const roleLabel = ROLES.find((r) => r[0] === role)[1];
    const url = 'https://lolalytics.com/lol/' + champ.slug + '/build/?lane=' + role;
    out.innerHTML =
      '<div class="card">' +
        '<div class="champ">' +
          '<img src="' + IMG + 'champion/' + champ.id + '.png" alt="">' +
          '<div><h2>' + champ.name + '</h2>' +
          '<div class="meta">' + roleLabel + ' · ' + laneData.games.toLocaleString('pl-PL') + ' gier' +
          (laneData.winrate ? ' · WR ' + laneData.winrate + '%' : '') +
          ' · <a href="' + url + '" target="_blank" rel="noopener">Lolalytics ↗</a></div></div>' +
        '</div>' +
        startHtml(items, laneData) +
        '<div class="itemrow"><div class="items">' +
          sortedRest(items.rest, laneData).map((id) => itemHtml(id, false, laneData)).join('') +
        '</div>' +
        (items.boot.length ? '<div class="bootbox"><div class="lbl">Buty' + (items.bootFallback ? '*' : '') + '</div>' +
          items.boot.map((id) => itemHtml(id, true, laneData)).join('') + '</div>' : '') +
        '</div>' +
        (items.rest.length < items.nMain ? '<div class="meta" style="margin-top:10px;color:#e0a060">Przy progu pick rate ≥ ' + items.minPr + '% w puli jest tylko ' + items.poolSize + ' itemów, więc wylosowano ich mniej niż ' + items.nMain + '. Obniż próg.</div>' : '') +
        (items.bootFallback ? '<div class="meta" style="margin-top:10px">* Brak butów w danych Lolalytics dla tego championa, więc są losowe spośród wszystkich.</div>' : '') +
        (items.swap ? '<div class="swapbox">' + itemHtml(items.swap, false, laneData) +
          '<div>💰 <b>Późna faza gry</b>: jeśli masz full build i dużo złota, możesz sprzedać buty i kupić zamiast nich ten item.</div></div>' : '') +
        '<div class="facts"><h3>🧠 Ciekawostki</h3><ul>' +
          current.facts.map((f) => '<li>' + f + '</li>').join('') +
        '</ul></div>' +
      '</div>';
    $('hist').innerHTML = history.length > 1 ? 'Wcześniej: <b>' + history.slice(1, 8).join('</b>, <b>') + '</b>' : '';
  }

  rollAll.onclick = rollChampion;
  rollItems.onclick = rollItemsOnly;
  // slider działa przy następnym losowaniu, sortowanie przestawia aktualny zestaw od razu
  $('minPr').oninput = () => { $('minPrVal').textContent = $('minPr').value + '%'; };
  // suwak championa: od razu pokazuje, ilu championów przechodzi próg (losowanie dopiero po kliknięciu)
  $('minChampPr').oninput = () => {
    $('minChampPrVal').textContent = $('minChampPr').value + '%';
    refreshCounts();
  };
  $('sortBy').onchange = () => { if (current) render(); };
})();
</script>
<script>
(function () {
  // ---------- zakładki (działają zawsze, także bez data.js) ----------
  const tabs = {
    build: [document.getElementById('tabBtnBuild'), document.getElementById('tabBuild')],
    challenge: [document.getElementById('tabBtnChallenge'), document.getElementById('tabChallenge')],
  };
  Object.keys(tabs).forEach((k) => {
    tabs[k][0].onclick = () => {
      Object.keys(tabs).forEach((n) => { tabs[n][0].classList.toggle('active', n === k); tabs[n][1].hidden = n !== k; });
    };
  });

  const D = window.LOL_DATA;
  if (!D) return;

  const $ = (id) => document.getElementById(id);
  const IMG = 'https://ddragon.leagueoflegends.com/cdn/' + D.ddragonVersion + '/img/';
  const ROLES = [['top', 'Top'], ['jungle', 'Jungle'], ['middle', 'Mid'], ['bottom', 'Bot / ADC'], ['support', 'Support']];
  const fmt = (n) => Math.round(n).toLocaleString('pl-PL');
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const randInt = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[randInt(a.length)];

  // ---------- receptury itemów: z data.js (scrape.mjs), a gdy ich brak, z Data Dragon ----------
  let recipes = D.recipes || null, recipesPromise = null;
  function loadRecipes() {
    if (recipes) return Promise.resolve(recipes);
    if (!recipesPromise) {
      recipesPromise = fetch('https://ddragon.leagueoflegends.com/cdn/' + D.ddragonVersion + '/data/en_US/item.json')
        .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then((j) => {
          const r = {};
          Object.keys(j.data).forEach((id) => {
            const it = j.data[id];
            if (it.maps && it.maps['11']) r[id] = { n: it.name, c: (it.gold && it.gold.total) || 0, f: it.from || [], i: it.into || [], t: it.tags || [] };
          });
          recipes = r;
          return r;
        })
        .catch(() => { recipesPromise = null; return null; });
    }
    return recipesPromise;
  }

  // wszystkie składniki (rekurencyjnie) danego itemu
  function parts(R, id, acc) {
    acc = acc || new Set();
    const r = R[id];
    if (!r) return acc;
    r.f.forEach((c) => { if (!acc.has(c)) { acc.add(c); parts(R, c, acc); } });
    return acc;
  }

  // ---------- dane championa i filtry z zakładki "Losowy build" ----------
  const pool = (r) => Object.values(D.champions).filter((c) => c.lanes[r]);
  const minChampPr = () => parseFloat($('minChampPr').value) || 0;
  const minItemPr = () => parseFloat($('minPr').value) || 0;
  const eligible = (r) => pool(r).filter((c) => minChampPr() <= 0 || (c.lanes[r].pickRate || 0) >= minChampPr());

  let role = null, state = null, token = 0;
  const rollAll = $('chRollAll'), rollRule = $('chRollRule');

  const rolesEl = $('chRoles');
  ROLES.forEach(([key, label]) => {
    const b = document.createElement('button');
    b.innerHTML = label + '<small>' + pool(key).length + ' champów</small>';
    b.disabled = pool(key).length === 0;
    b.onclick = () => {
      role = key;
      [...rolesEl.children].forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      rollAll.disabled = false;
      rollRule.disabled = true;
      $('chNote').textContent = 'Progi pick rate (championa i itemu) z zakładki „Losowy build” obowiązują też tutaj.';
      rollChampion();
    };
    rolesEl.appendChild(b);
  });

  // ---------- generatory wyzwań; każdy zwraca { html } albo { err } ----------
  const nm = (R, id) => (R && R[id] && R[id].n) || D.items[id] || id;
  const iconUrl = (id) => IMG + 'item/' + id + '.png';

  function chip(R, id, lane, out) {
    const s = lane.itemStats && lane.itemStats[id];
    return '<div class="it' + (out ? ' out' : '') + '" title="' + esc(nm(R, id)) + '"><img src="' + iconUrl(id) + '" alt="" loading="lazy">' +
      esc(nm(R, id)) + (s ? '<br><span class="pr">' + s.pr + '%</span>' : '') + '</div>';
  }
  const byPr = (lane) => (a, b) => (((lane.itemStats || {})[b] || {}).pr || 0) - (((lane.itemStats || {})[a] || {}).pr || 0);
  const ruleCard = (cls, tag, id, title, text) =>
    '<div class="rule ' + cls + '">' + (id ? '<div class="rimg"><img src="' + iconUrl(id) + '" alt=""></div>' : '') +
    '<div><div class="rtag">' + tag + '</div><h3>' + title + '</h3><p>' + text + '</p></div></div>';

  const GENERATORS = {
    // 🚫 nie kupujesz składnika osobno, ale gotowe itemy, w których on jest, już tak
    component(champ, lane, R) {
      if (!R) return { err: 'Nie udało się wczytać receptur itemów (brak internetu?). Uruchom ponownie <code>node scrape.mjs</code>, wtedy receptury będą już w data.js.' };
      const items = lane.items;
      const cnt = {};
      items.forEach((id) => parts(R, id).forEach((c) => { cnt[c] = (cnt[c] || 0) + 1; }));
      const all = Object.keys(cnt).filter((c) => {
        const r = R[c];
        return r && r.i.length && r.c <= 1300 && c !== '1001' && !r.t.some((t) => t === 'Boots' || t === 'Consumable' || t === 'Trinket');
      });
      if (!all.length) return { err: 'Dla tego championa nie znalazłem sensownego składnika do zakazania. Wylosuj ponownie.' };
      // preferujemy składniki, które dotyczą kilku, ale nie większości itemów z puli
      const pref = all.filter((c) => cnt[c] >= 2 && cnt[c] <= Math.ceil(items.length * 0.6));
      const c = pick(pref.length ? pref : all);
      const hit = items.filter((id) => parts(R, id).has(c)).sort(byPr(lane));
      const free = items.filter((id) => !hit.includes(id)).sort(byPr(lane));
      return {
        html: ruleCard('', '🚫 Zakazany składnik', c, esc(nm(R, c)) + ' <small>' + fmt(R[c].c) + ' g</small>',
          'Nie wolno Ci kupić go <b>jako osobnego przedmiotu</b>, ma nie leżeć w ekwipunku sam. ' +
          'Gotowe itemy, które go zawierają, kupujesz normalnie, czyli w razie potrzeby cały item naraz, ' +
          'po zebraniu pozostałych składników.') +
          '<div class="rlist"><h4>Zawierają go <span>(' + hit.length + ' z puli championa, kupuj je od razu w całości)</span></h4><div class="mini">' +
          hit.map((id) => chip(R, id, lane, true)).join('') + '</div></div>' +
          '<div class="rlist"><h4>Bez ograniczeń <span>(' + free.length + ')</span></h4><div class="mini">' +
          (free.length ? free.map((id) => chip(R, id, lane, false)).join('') : '<span class="meta">Wszystkie itemy z puli zawierają ten składnik.</span>') + '</div></div>',
      };
    },

    // 1️⃣ pierwszy skompletowany item jest narzucony
    first(champ, lane, R) {
      const st = lane.itemStats || {};
      const ok = lane.items.filter((id) => !st[id] || st[id].pr >= minItemPr());
      if (!ok.length) return { err: 'Próg pick rate itemu wykluczył wszystkie itemy. Obniż go w zakładce „Losowy build”.' };
      const id = pick(ok), s = st[id];
      return {
        html: ruleCard('good', '1️⃣ Obowiązkowy pierwszy item', id, esc(nm(R, id)) + (R && R[id] ? ' <small>' + fmt(R[id].c) + ' g</small>' : ''),
          'Pierwszy <b>skompletowany</b> item w tej grze musi być właśnie ten, zanim skończysz jakikolwiek inny. Składniki innych itemów możesz kupować po drodze.' +
          (s ? '<br>Lolalytics: <span class="' + (s.wr >= 50 ? 'wr-good' : 'wr-bad') + '">WR ' + s.wr + '%</span> · <span class="pr">PR ' + s.pr + '%</span>' +
            (s.time != null ? ' · kupowany średnio ok. ' + Math.round(s.time) + ' min' : '') : '')),
      };
    },

    // 👟 buty dopiero po minucie N
    boots(champ, lane, R) {
      const n = pick([10, 12, 14, 16, 18, 20, 22, 25]);
      return { html: ruleCard('', '👟 Bez butów', null, 'Do ' + n + '. minuty gry', 'Nie wolno Ci kupić butów przed <b>' + n + '. minutą</b> gry (ani składnika Boots). Dopiero potem kupujesz je normalnie. Kasę wydajesz na resztę buildu.') };
    },

    // 🔥 zakaz dwóch najpopularniejszych itemów championa
    meta(champ, lane, R) {
      const st = lane.itemStats || {};
      const top = lane.items.filter((id) => st[id]).sort(byPr(lane)).slice(0, 2);
      if (top.length < 2) return { err: 'Za mało danych o itemach tego championa, żeby wskazać metowe.' };
      return {
        html: ruleCard('', '🔥 Zakaz metowych itemów', null, 'Bez najpopularniejszych',
          'Nie wolno Ci kupić dwóch najczęściej kupowanych itemów tego championa na tej roli. Musisz zbudować coś niestandardowego.') +
          '<div class="rlist"><h4>Zakazane</h4><div class="mini">' + top.map((id) => chip(R, id, lane, true)).join('') + '</div></div>',
      };
    },
  };

  // ---------- losowanie ----------
  function newRule() {
    const wanted = $('chType').value;
    const order = wanted === 'random' ? ['component', 'first', 'boots', 'meta'].sort(() => Math.random() - 0.5) : [wanted];
    return loadRecipes().then((R) => {
      let res = null, used = null;
      for (const t of order) {
        res = GENERATORS[t](state.champ, state.lane, R);
        if (!res.err) { used = t; break; }
      }
      state.res = res; state.type = used;
    });
  }

  function rollChampion() {
    const list = eligible(role);
    if (!list.length) {
      state = null;
      rollRule.disabled = true;
      $('chOut').innerHTML = '<div class="err">Żaden champion na tej roli nie ma pick rate ≥ <b>' + minChampPr() + '%</b>. Obniż próg championa w zakładce „Losowy build”.</div>';
      return;
    }
    const champ = pick(list);
    state = { champ, lane: champ.lanes[role] };
    const my = ++token;
    newRule().then(() => { if (my === token) { render(); rollRule.disabled = false; } });
  }

  function rerollRule() {
    if (!state) return;
    const my = ++token;
    newRule().then(() => { if (my === token) render(); });
  }

  function render() {
    const { champ, lane, res } = state;
    const roleLabel = ROLES.filter((r) => r[0] === role)[0][1];
    const url = 'https://lolalytics.com/lol/' + champ.slug + '/build/?lane=' + role;
    $('chOut').innerHTML = '<div class="card"><div class="champ">' +
      '<img src="' + IMG + 'champion/' + champ.id + '.png" alt="">' +
      '<div><h2>' + esc(champ.name) + '</h2><div class="meta">' + roleLabel + ' · ' + fmt(lane.games) + ' gier' +
      (lane.winrate ? ' · WR ' + lane.winrate + '%' : '') +
      ' · <a href="' + url + '" target="_blank" rel="noopener">Lolalytics ↗</a></div></div></div>' +
      (res.err ? '<div class="err" style="margin-top:20px">' + res.err + '</div>' : res.html) + '</div>';
  }

  rollAll.onclick = rollChampion;
  rollRule.onclick = rerollRule;
  $('chType').onchange = () => { if (state) rerollRule(); };
})();
</script>
